# Radar de datos: cada domingo mira qué han publicado INE, Eurostat, Banco de España,
# BOE, AIReF, BBVA Research y CaixaBank Research sobre los temas de David y abre un issue con las novedades (etiqueta «radar»).
# Todo lo hace código (scripts/radar/radar.py); aquí no interviene ninguna IA.
# Después, la rutina de Claude del radar comenta el issue y, si un dato encaja, propone
# añadirlo al analista con un PR (ver RADAR.md).

name: Radar de datos

on:
  schedule:
    - cron: "0 6 * * 0"   # domingo 6:00 UTC, antes de la rutina de Claude (8:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actualizar-y-publicar   # no coincidir con otros commits a main
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit de radar/
      issues: write     # issue semanal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Buscar novedades
        run: python scripts/radar/radar.py

      - name: Commit
        run: |
          if git diff --quiet -- radar/ && [ -z "$(git ls-files --others --exclude-standard radar/)" ]; then
            echo "Sin cambios en radar/."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar/
          git commit -m "Radar: novedades de la semana" -m "Generado por scripts/radar/radar.py."
          git push

      - name: Abrir el issue de la semana
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r n e < <(python -c "import json; d=json.load(open('radar/novedades.json')); print(len(d['novedades']), len(d['errores']))")
          if [ "$n" = "0" ] && [ "$e" = "0" ]; then
            echo "Sin novedades: no se abre issue."
            exit 0
          fi
          titulo="${n} novedades"
          if [ "$e" != "0" ]; then titulo="${titulo}, ${e} fuente(s) con error"; fi
          gh label create radar --color 1d76db --description "Radar semanal de datos" --force
          hoy=$(date -u +%F)
          gh issue create --title "Radar semanal ${hoy}: ${titulo}" --label radar --body-file radar/novedades.md
