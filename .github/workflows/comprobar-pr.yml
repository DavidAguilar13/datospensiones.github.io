# Comprueba los PR que tocan los scripts (por ejemplo, los que propone el agente del radar
# para añadir un dato al analista): ejecuta hallazgos.py y el radar para ver que descargan,
# validan y calculan sin errores. No hace commit ni publica nada.

name: Comprobar PR de scripts

on:
  pull_request:
    paths:
      - "scripts/**"

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependencias y fuente de los gráficos
        run: |
          pip install -r scripts/requirements.txt
          sudo apt-get install -y --no-install-recommends fonts-crosextra-carlito >/dev/null
          python -c "import matplotlib.font_manager as f; f._load_fontmanager(try_read_cache=False)"

      - name: Hallazgos del analista (descarga, validación y gráficos)
        run: python scripts/analista/hallazgos.py

      - name: Radar
        run: python scripts/radar/radar.py --dias 7
