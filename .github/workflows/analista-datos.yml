# Prepara cada semana el material del analista: cifras (analisis/hallazgos.json)
# y gráficos (analisis/graficos/*.png), calculados por código a partir de los datos
# ya validados de la web y del INE. El agente redactor (rutina de Claude) los usa
# después para escribir el borrador; aquí no interviene ninguna IA.
#
# analisis/ no se publica en la web.

name: Analista - preparar datos y gráficos

on:
  schedule:
    - cron: "0 5 * * 1"   # lunes 5:00 UTC, antes de que la rutina de Claude redacte el borrador
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actualizar-y-publicar   # no coincidir con la actualización de datos
  cancel-in-progress: false

jobs:
  hallazgos:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit de analisis/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependencias y fuente de los gráficos
        run: |
          pip install -r scripts/requirements.txt
          sudo apt-get install -y --no-install-recommends fonts-crosextra-carlito >/dev/null
          python -c "import matplotlib.font_manager as f; f._load_fontmanager(try_read_cache=False)"

      - name: Calcular hallazgos y gráficos
        run: python scripts/analista/hallazgos.py

      - name: Commit
        run: |
          if git diff --quiet -- analisis/ && [ -z "$(git ls-files --others --exclude-standard analisis/)" ]; then
            echo "Sin cambios en analisis/."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analisis/
          git commit -m "Analista: hallazgos y gráficos de la semana" -m "Generado por scripts/analista/hallazgos.py."
          git push
